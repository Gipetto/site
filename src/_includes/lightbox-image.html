<a href="{{ href | default: img_lg | escape }}" class="lightbox {{ additional_classes | escape }}" data-lb-image="{{ imgLg.src | default: img_lg | escape }}" data-lb-image-height="{{ imgLg.height | escape }}" data-lb-image-width="{{ imgLg.width | escape }}">
  <picture id="{{ id_prefix | default: "photo" }}-{{ id | escape }}">
{% for source in sources %}
  <source srcset="{{ source.src | escape }}" media="{{ source.media | escape }}" />
{% endfor %}
  <img src="{{ img.src | default: img_sm | escape }}"  alt="Photograph: {{ title | escape }}">
</picture>
</a>
